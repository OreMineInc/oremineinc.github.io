<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08162f"/>
      <stop offset="0.55" stop-color="#102d62"/>
      <stop offset="1" stop-color="#0b203f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.48" r="0.52">
      <stop offset="0" stop-color="#4cebf0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4cebf0" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="36" fill="url(#background)"/>
  <rect width="1200" height="630" rx="36" fill="url(#glow)"/>
  <circle cx="1110" cy="80" r="220" fill="#487cff" opacity="0.08"/>
