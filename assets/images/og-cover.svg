  <text x="472" y="265" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="94" font-weight="800" letter-spacing="-3">OreMine</text>
  <text x="472" y="360" fill="#4cebf0" font-family="Inter, Arial, sans-serif" font-size="94" font-weight="800" letter-spacing="-3">Wiki</text>
