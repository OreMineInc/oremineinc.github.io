name: oremine-wiki

services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
    image: oremine-wiki:local
    working_dir: /srv/jekyll
    command: >-
      jekyll serve
      --host 0.0.0.0
      --port 4000
      --livereload
      --force_polling
    environment:
      JEKYLL_ENV: development
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - .:/srv/jekyll
